services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drawaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawaid}
      POSTGRES_DB: ${POSTGRES_DB:-drawaid}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drawaid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./server
    image: ${APP_IMAGE:-drawaid-app:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-drawaid}:${POSTGRES_PASSWORD:-drawaid}@db:5432/${POSTGRES_DB:-drawaid}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BRAND_NAME: ${BRAND_NAME:-DRAWAID}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-55}
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - uploads-data:/app/data/uploads
    expose:
      - "3000"
    ports:
      # Exposed directly for local development; in production, remove this
      # and let Caddy (below) be the only public entrypoint.
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    profiles: ["prod"]

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
