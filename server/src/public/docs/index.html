<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Documentation</title>
  <link rel="stylesheet" href="/static/ui.css">
  <style>
    .docs { max-width: 1120px; margin: 0 auto; padding: 24px 16px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; }
    .toc { position: sticky; top: 76px; align-self: start; font-size: 0.9rem; max-height: calc(100vh - 100px); overflow: auto; }
    .toc a { display: block; padding: 5px 10px; color: var(--muted); border-left: 2px solid var(--border); }
    .toc a:hover { color: var(--text); text-decoration: none; border-color: var(--accent); }
    .doc h1 { font-size: 2rem; margin-bottom: 8px; }
    .doc h2 { font-size: 1.4rem; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); scroll-margin-top: 72px; }
    .doc h3 { font-size: 1.1rem; margin: 28px 0 8px; scroll-margin-top: 72px; }
    .doc p, .doc li { line-height: 1.65; }
    .doc ul, .doc ol { padding-left: 22px; margin: 0 0 14px; }
    .doc table { margin: 8px 0 18px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: block; overflow-x: auto; }
    .doc th { background: var(--surface-2); }
    .doc td { vertical-align: top; }
    .doc blockquote { margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
    .doc blockquote p { margin: 0; }
    .codeblock { position: relative; margin: 10px 0 18px; }
    .codeblock pre { margin: 0; padding: 14px 16px; background: #0f172a; color: #e2e8f0; border-radius: 10px; overflow-x: auto; font: 0.84rem/1.55 var(--mono); }
    .codeblock .lang { position: absolute; top: 8px; right: 70px; font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .codeblock button { position: absolute; top: 6px; right: 8px; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; font-size: 0.75rem; padding: 3px 9px; cursor: pointer; }
    .codeblock button:hover { background: #334155; }
    @media (max-width: 800px) { .docs { grid-template-columns: 1fr; } .toc { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark"></span><span id="brand">API</span><small>Docs</small></div>
      <nav class="nav"></nav>
      <div class="topbar-user"><a class="btn sm primary" href="/portal/">Company portal</a></div>
    </div>
  </header>
  <div class="docs">
    <aside class="toc" id="toc"></aside>
    <article class="doc" id="doc"><p class="muted">Loading…</p></article>
  </div>
  <script>
    (function () {
      const el = (tag, attrs, ...kids) => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) v != null && n.setAttribute(k, v);
        kids.flat().forEach((c) => c != null && n.appendChild(c instanceof Node ? c : document.createTextNode(c)));
        return n;
      };

      // Inline: `code`, **bold**, *italic*, [text](url). Everything becomes DOM nodes, never HTML strings.
      function inline(text) {
        const out = [];
        const re = /`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*|\[([^\]]+)\]\(([^)\s]+)\)/g;
        let last = 0, m;
        while ((m = re.exec(text))) {
          if (m.index > last) out.push(text.slice(last, m.index));
          if (m[1] !== undefined) out.push(el("code", {}, m[1]));
          else if (m[2] !== undefined) out.push(el("strong", {}, inline(m[2])));
          else if (m[3] !== undefined) out.push(el("em", {}, inline(m[3])));
          else if (/^(https?:\/\/|\/|#)/.test(m[5])) out.push(el("a", { href: m[5] }, m[4]));
          else out.push(m[0]);
          last = re.lastIndex;
        }
        if (last < text.length) out.push(text.slice(last));
        return out;
      }

      const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const splitRow = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

      function render(md) {
        const lines = md.replace(/\r/g, "").split("\n");
        const root = document.createDocumentFragment();
        const toc = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) { i++; continue; }

          const fence = line.match(/^```(\w*)/);
          if (fence) {
            const buf = [];
            i++;
            while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
            i++;
            const code = buf.join("\n");
            const btn = el("button", { type: "button" }, "Copy");
            btn.onclick = () => navigator.clipboard.writeText(code).then(() => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1500); });
            root.appendChild(el("div", { class: "codeblock" }, fence[1] ? el("span", { class: "lang" }, fence[1]) : null, btn, el("pre", {}, el("code", { style: "background:none;padding:0;color:inherit" }, code))));
            continue;
          }

          const hd = line.match(/^(#{1,3})\s+(.*)$/);
          if (hd) {
            const level = hd[1].length;
            const id = slug(hd[2]);
            root.appendChild(el("h" + level, { id }, inline(hd[2])));
            if (level === 2) toc.push([id, hd[2]]);
            i++;
            continue;
          }

          if (line.startsWith("|") && lines[i + 1] && /^\|?\s*-{3,}/.test(lines[i + 1].trim().replace(/^\|\s*/, "|"))) {
            const head = splitRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].startsWith("|")) rows.push(splitRow(lines[i++]));
            root.appendChild(el("table", {}, el("thead", {}, el("tr", {}, head.map((c) => el("th", {}, inline(c))))), el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c) => el("td", {}, inline(c))))))));
            continue;
          }

          if (line.startsWith(">")) {
            const buf = [];
            while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
            root.appendChild(el("blockquote", {}, el("p", {}, inline(buf.join(" ")))));
            continue;
          }

          const ul = line.match(/^\s*[-*]\s+/), ol = line.match(/^\s*\d+\.\s+/);
          if (ul || ol) {
            const list = el(ol ? "ol" : "ul");
            const re = ol ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
            while (i < lines.length && re.test(lines[i])) {
              let text = lines[i++].replace(re, "");
              while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !re.test(lines[i])) text += " " + lines[i++].trim();
              list.appendChild(el("li", {}, inline(text)));
            }
            root.appendChild(list);
            continue;
          }

          const buf = [];
          while (i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|>|\|)/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) buf.push(lines[i++]);
          root.appendChild(el("p", {}, inline(buf.join(" "))));
        }
        return { root, toc };
      }

      fetch("/docs/API.md")
        .then((r) => r.text())
        .then((md) => {
          const { root, toc } = render(md);
          document.getElementById("doc").replaceChildren(root);
          document.getElementById("toc").replaceChildren(...toc.map(([id, t]) => el("a", { href: "#" + id }, t)));
          const title = (md.match(/^#\s+(.*)$/m) || [])[1] || "API Documentation";
          document.title = title;
          document.getElementById("brand").textContent = title.replace(/\s*Integration Guide$/, "");
          if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
        })
        .catch(() => { document.getElementById("doc").textContent = "Could not load the documentation."; });
    })();
  </script>
</body>
</html>
